# release.conf - URLs e versões desta app. É a ÚNICA fonte destes valores.
#
# Formato: CHAVE=valor, uma por linha, sem aspas e sem espaços à volta do "=".
# Linhas começadas por # são comentários.
# Qualquer chave pode ser sobreposta por uma variável de ambiente com o mesmo nome.
#
# Este ficheiro é copiado para dentro do pacote no build (memoria/release.conf).
# A app lê primeiro $MEMORIA_HOME/config.json e só depois este ficheiro.
# Os instaladores recebem estes valores num bloco de configuração gerado
# por scripts/render_installers.py.
#
# Marcadores nos padrões:
#   {repo}    URL do repositório sem ".git"  (ex.: https://servidor/dono/nome)
#   {host}    servidor                       (ex.: servidor)
#   {owner}   dono                           (ex.: dono)
#   {name}    nome do repositório            (ex.: nome)
#   {version} tag da versão                  (ex.: v0.1.0)
#   {file}    nome de um asset da release
#
# Para mudar para um alojamento público: editar este ficheiro e fazer nova release.

MEMORY_APP_REPO_URL=https://gitea.guilhermepinto.pt/guilherme/claude-memory-app.git
MEMORY_APP_VERSION=v0.1.0

# Igual em Gitea e GitHub.
RELEASE_DOWNLOAD_URL={repo}/releases/download/{version}/{file}

# Usado só por scripts/publish-release.sh (criar releases): gitea | github
RELEASE_PROVIDER=gitea

# Versões fixadas das ferramentas usadas pelos instaladores.
UV_VERSION=0.13.1
PYTHON_VERSION=3.12
